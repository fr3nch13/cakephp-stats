name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_TEST_URL: sqlite://./testdb.sqlite

jobs:
  quality:
    name: Code Standards and Static Analysis
    runs-on: &default-runner ubuntu-24.04

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, intl, pdo_sqlite
        coverage: none

    - name: Composer install
      uses: ramsey/composer-install@v4

    - name: Run checks
      run: |
        composer validate --strict
        composer run-script cs-check
        composer run-script phpstan

  testsuite:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: *default-runner
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5', 'latest']

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pdo_sqlite
        ini-values: zend.assertions=1
        coverage: none

    - name: Composer install
      uses: ramsey/composer-install@v4

    - name: Run PHPUnit
      run: composer run-script test

  coverage-php:
    name: Code Coverage
    runs-on: *default-runner

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, intl, pdo_sqlite
        coverage: xdebug

    - name: Composer install
      uses: ramsey/composer-install@v4

    - name: Run PHPUnit
      run: composer run-script coverage-clover

    - name: Upload to Codecov
      uses: codecov/codecov-action@v7
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./coverage.xml
        verbose: true

  required-checks:
    name: Required checks
    needs:
    - quality
    - testsuite
    - coverage-php
    if: always()
    runs-on: ubuntu-24.04

    steps:
    - name: Verify required jobs
      env:
        QUALITY_RESULT: ${{ needs.quality.result }}
        TESTSUITE_RESULT: ${{ needs.testsuite.result }}
        COVERAGE_RESULT: ${{ needs.coverage-php.result }}
      run: |
        test "$QUALITY_RESULT" = success
        test "$TESTSUITE_RESULT" = success
        test "$COVERAGE_RESULT" = success
